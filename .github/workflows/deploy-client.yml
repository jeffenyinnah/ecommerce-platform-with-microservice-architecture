name: Deploy Client Service Test

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/deploy-client.yml']
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: sample-client
  ECS_SERVICE: sample-client-service
  ECS_CLUSTER: sample-production-cluster-test
  CONTAINER_NAME: client-container

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ALB_DNS: sample-production-alb-253642766.eu-north-1.elb.amazonaws.com
        run: |
          cd client
          docker build \
            --build-arg NEXT_PUBLIC_AUTH_URL=http://$ALB_DNS \
            --build-arg NEXT_PUBLIC_PAYMENT_URL=http://$ALB_DNS \
            --build-arg NEXT_PUBLIC_ORDER_URL=http://$ALB_DNS \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION